function parsedTable(tbl){

    const normalized=x.fields.map(clean);

function api(name,...args){

  if(name==='fbhMeta')return Promise.resolve({tabs:fallbackTabs,user:{email:'demo@febracis.com.br',isEditor:true,canWrite:false},book:'INFRA LPs — PRODUTOS'});

 if(t.dataset.go)return home();
 const act=t.dataset.action;
 if(act==='applyHomeSearch'){homeQuery=homeDraft.trim();renderHome();return}
 if(act==='clearHomeSearch'){homeDraft='';homeQuery='';renderHome();return}
 if(act==='refresh'&&selected){return product(selected);}
 if(!data)return;
 if(act==='applySearch'){search=searchDraft.trim();pageLimit=12;renderProduct();return}
 if(act==='clearSearch'){search='';searchDraft='';status='';pageLimit=12;renderProduct();return}
 if(act==='loadmore'){pageLimit+=12;renderProduct();return}
 if(act==='refresh')return product(selected);
 if(act==='create')return showCreate();
 if(act==='cancelCreate'){closeDrawer();return}
 const r=data.rows.find(r=>String(r.rowNumber)===t.dataset.row);if(!r)return;
 if(act==='edit')return showEdit(r);
 if(act==='details')return showDetails(r);
 if(act==='copyurl')return copyText(rowCell(r,5));
 if(act==='copyorigin')return copyText(String(rowCell(r,28)||''));
 if(act==='open'){const u=validUrl(rowCell(r,5));if(u)window.open(u,'_blank','noopener,noreferrer');return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='homeSearch')homeDraft=e.target.value;
 if(e.target.id==='search')searchDraft=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='status'){status=e.target.value;pageLimit=12;renderProduct()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeDrawer();
 if(e.key==='Enter'&&e.target.id==='homeSearch'){e.preventDefault();homeQuery=homeDraft.trim();renderHome()}
 if(e.key==='Enter'&&e.target.id==='search'){e.preventDefault();search=searchDraft.trim();pageLimit=12;renderProduct()}
});

$('backdrop').onclick=closeDrawer;$('close').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
async function refreshVisibleTabs(){
 if(DEMO || !meta) return;
 try {
   const updated=await api('fbhMeta');
   const changed=JSON.stringify(updated.tabs)!==JSON.stringify(meta.tabs);
   meta=updated;
   $('viewSwitcher').style.display=meta.user.isEditor?'flex':'none';
   if(changed){
     if(selected && !updated.tabs.includes(selected)){closeDrawer();await home();notify('A aba foi removida da lista de produtos.');}
     else if(selected===null){await home();notify('A lista de produtos foi atualizada.');}
   }
 }catch(error){console.warn('Falha ao atualizar visibilidade das abas:',error.message);}
}
function refreshPresence(){
 if(!meta)return;
 api('fbhPresence').then(p=>{
  var arr=p.people||[];
  const avatar=u=>{const photo=String(u.photo||'');const canPhoto=/^https:\/\/(?:[^\/]+\.)?(?:googleusercontent\.com|ggpht\.com)\//i.test(photo);return '<span class=\"presenceAvatar\" title=\"'+esc(u.name||'Colaborador')+' · '+esc(u.email||'')+'\">'+(canPhoto?'<img alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" src=\"'+esc(photo)+'\" onerror=\"this.remove()\">':'')+'<span class=\"avatarFallback\">'+esc(u.initials||'?')+'</span></span>'};
  $('presenceAvatars').innerHTML=arr.slice(-6).reverse().map(avatar).join('')+(arr.length>6?'<span class=\"presenceAvatar extraUsers\" title=\"Mais '+(arr.length-6)+' pessoas\">+'+(arr.length-6)+'</span>':'');
  const current=arr.find(u=>u.email===meta.user.email);
  if(current){$('userAvatar').innerHTML=avatar(current);$('userAvatar').title=current.name+' · '+current.email;}
  $('presenceCount').textContent=arr.length===1?'1 pessoa':arr.length+' pessoas';
  $('mobilePresenceAvatars').innerHTML=arr.slice(-4).reverse().map(avatar).join('');
  $('mobileActiveCount').textContent=arr.length===1?'1 pessoa no Hub':arr.length+' pessoas no Hub';
 }).catch(()=>{$('presenceCount').textContent='-';$('mobileActiveCount').textContent='Presença indisponível';});
}
$('brandHome').onclick=()=>{if(meta)home();else location.reload();};
function syncMobileNavigation(){
 const homeTab=$('mobileProducts'), searchTab=$('mobileSearch'), action=$('mobileAction');
 const inProduct=Boolean(selected), canCreate=Boolean(inProduct&&meta?.user?.canWrite);
 homeTab.classList.toggle('isActive',!inProduct);
 searchTab.classList.remove('isActive');
 action.classList.toggle('canCreate',canCreate);
 $('mobileActionIcon').textContent=canCreate?'＋':'↻';
 $('mobileActionLabel').textContent=canCreate?'Nova LP':'Atualizar';
 action.setAttribute('aria-label',canCreate?'Adicionar LP':'Atualizar dados');
}
$('mobileProducts').onclick=()=>{if(meta)home();window.scrollTo({top:0,behavior:'smooth'});};
$('mobileSearch').onclick=()=>{
 const box=$(selected?'search':'homeSearch');
 if(box){box.scrollIntoView({behavior:'smooth',block:'center'});setTimeout(()=>box.focus({preventScroll:true}),120);}
 else if(meta)home();
};
$('mobileAction').onclick=()=>{
 if(selected&&meta?.user?.canWrite)return showCreate();
 if(selected)return product(selected);
 if(meta)return home();
};
$('mobileSheet').onclick=()=>{if(meta?.user?.isEditor&&meta?.spreadsheetUrl)window.open(meta.spreadsheetUrl,'_blank','noopener,noreferrer')};
$('openSheet').onclick=()=>{if(meta&&meta.user.isEditor&&meta.spreadsheetUrl)window.open(meta.spreadsheetUrl,'_blank','noopener,noreferrer');};
function showStartupError(message){
 const msg=String(message||'Não foi possível iniciar o aplicativo.');
 const out=$('content');
 if(out)out.innerHTML='<div class="bootError"><strong>Não foi possível carregar o Hub</strong><p>'+esc(msg)+'</p><div class="bootActions"><button type="button" class="btn dark" id="retryHub">Tentar novamente</button><a class="btn" href="https://docs.google.com/spreadsheets/d/1-fBTQgYLtEOrNlXAfoRUZStzgGMuoQVbxhE3MwMFFwQ/edit?gid=920354363" target="_blank" rel="noopener noreferrer">Abrir planilha</a></div></div>';
 const r=$('retryHub');if(r)r.onclick=()=>location.reload();
 if($('mobileActiveCount'))$('mobileActiveCount').textContent='Conexão indisponível';
}
// Failsafe: never leave the initial loading screen indefinitely, even if iOS WebView stalls.
let bootstrapDone=false;
const startupWatchdog=setTimeout(()=>{
 if(!bootstrapDone)showStartupError('O Google não respondeu ao iniciar o Hub. Abra no Safari ou Chrome, confirme a conta Google e tente novamente.');
},18000);
api('fbhMeta').then(m=>{
 bootstrapDone=true;clearTimeout(startupWatchdog);
 meta=m;
 $('userAvatar').textContent=(m.user.email||'F').split('@')[0].split(/[._-]/).map(x=>x[0]||'').slice(0,2).join('').toUpperCase();
 $('identityChip').textContent=(m.user.isEditor?'Editor':'Visualizador')+' · '+(m.user.email||'Conta não identificada');
 $('identityChip').title='Permissões verificadas para '+(m.user.email||'conta não identificada');
 $('mobileRole').textContent=m.user.isEditor?'Acesso de editor':'Acesso de visualizador';
 $('mobileSheet').hidden=!m.user.isEditor;
 try{syncMobileNavigation()}catch(error){console.warn('Navegação mobile:',error)}
 $('viewSwitcher').style.display=m.user.isEditor?'flex':'none';
 Promise.resolve().then(()=>home()).catch(error=>showStartupError(error.message));
 if(DEMO){$('presenceCount').textContent='prévia';$('mobileActiveCount').textContent='Modo de demonstração';$('mobileRole').textContent='Dados ilustrativos';$('mobileSheet').hidden=true;}
 else if(window.__FBH_READONLY){$('presenceCount').textContent='Consulta';$('mobileActiveCount').textContent='Consulta pública';$('mobileRole').textContent='Somente leitura';}else {refreshPresence();setInterval(refreshPresence,45000);setInterval(refreshVisibleTabs,60000);}
}).catch(e=>{bootstrapDone=true;clearTimeout(startupWatchdog);showStartupError(e.message);});
})();
