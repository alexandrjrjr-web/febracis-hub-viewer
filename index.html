<script>
// Read-only transport: Google Sheets is already shared as 'anyone with link — reader'.

(()=>{

  const ID='1-fBTQgYLtEOrNlXAfoRUZStzgGMuoQVbxhE3MwMFFwQ';
  const WORKBOOK=`https://docs.google.com/spreadsheets/d/${ID}/edit`;
  const EDITOR='https://script.google.com/a/macros/febracis.com.br/s/AKfycbwH7OuSW7zEsfc74N5xoRUKIEXK91XW46RBciEL4w57uPfJ_g8kFb-qVZFEGn9VnFhOvA/exec';
  const TAB_IDS={
    'Método CIS (new)':360542450,
    'CAMILA VIEIRA':2111035062,
    'BUSINESS':43991303,
    'PAULO VIEIRA':1502514281,
    'COLIGADAS':2018969214
  };
  const inflight=new Map();const memory=new Map();let serial=0;
  const labels=()=>Object.keys(TAB_IDS);
  function gviz(gid){
    return new Promise((resolve,reject)=>{
      const cb='__fbhRead'+(++serial),tag=document.createElement('script');
      let completed=false;
      const finish=(error,raw)=>{if(completed)return;completed=true;clearTimeout(timer);tag.remove();delete window[cb];if(error)reject(error);else resolve(raw)};
      const timer=setTimeout(()=>finish(new Error('A planilha demorou a responder. Tente Atualizar.')),20000);
      window[cb]=raw=>{if(!raw||raw.status!=='ok'||!raw.table){finish(new Error('Não foi possível ler esta aba pública.'));return;}finish(null,raw.table)};
      tag.onerror=()=>finish(new Error('Acesso à planilha indisponível. Verifique o compartilhamento e sua conexão.'));
      const qs=new URLSearchParams({gid:String(gid),headers:'0',tqx:`out:json;responseHandler:${cb}`,tq:'select *'});
      tag.src=`https://docs.google.com/spreadsheets/d/${ID}/gviz/tq?${qs}`;
      document.head.append(tag);
    });
  }
  function normalize(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toUpperCase().replace(/\s+/g,' ').trim()}
  function layout(matrix){for(let i=0;i<Math.min(matrix.length,14);i++){const h=matrix[i].map(normalize);if(h.includes('NOME DA PAGINA')&&h.some(x=>/URL|PRODUTO|STATUS|TIPOLOGIA/.test(x)))return {index:i,headers:matrix[i],normalized:h}}return null}
  function pick(raw,keys,names,preferLast=false){for(const key of names){const matches=keys.flatMap((v,i)=>v===key?[i]:[]);if(preferLast)matches.reverse();for(const i of matches)if(String(raw[i]||'').trim())return String(raw[i])}return ''}
  function convert(table,name){
    const matrix=table.rows.map(row=>Array.from({length:table.cols.length},(_,i)=>{const c=row.c?.[i];return c?.f!==undefined&&c?.f!==null?String(c.f):c?.v===null||c?.v===undefined?'':String(c.v)}));
    const header=layout(matrix);
    if(!header)throw new Error('O cabeçalho da aba não foi reconhecido. A planilha não foi alterada.');
    const keys=header.normalized;
    const canonical=keys[1]==='STATUS'&&keys[3]==='FUNIL'&&keys[4]==='NOVO NOME'&&keys[5]?.includes('NOVA URL');
    const rows=matrix.slice(header.index+1).map((raw,i)=>{
      const c=Array(47).fill('');
      if(canonical){raw.forEach((v,j)=>{if(j<47)c[j]=v})}
      else{
        const p=(...names)=>pick(raw,keys,names),last=(...names)=>pick(raw,keys,names,true);
        c[0]=p('NOME DA PAGINA');c[1]=p('STATUS');c[2]=p('PRODUTO');c[3]=p('FUNIL');
        c[4]=p('NOVO NOME DA PAGINA','NOVO NOME')||last('NOME DA PAGINA')||c[0];
        c[5]=p('NOVA URL (INFRA NOVA)','NOVA URL','URL','URL DA PAGINA');
        c[6]=p('TIPOLOGIA','PUBLICO-ALVO / OBSERVACOES');c[14]=p('TIPO DE PAGINA');
        c[15]=p('TIPO DE REDIRECIONAMENTO');c[28]=p('NOVA ORIGEM','ORIGEM');
        c[29]=p('CODIGO DA COLIGADA','COLIGADA ID','COLIGADA');
      }
      if(/\[LOVABLE\]/i.test(c[4]))c[28]=c[4];
      const originalFields=raw.map((v,j)=>({column:j+1,label:header.headers[j]||`Coluna ${j+1}`,value:String(v||'')}));

    const promise=gviz(TAB_IDS[name]).then(table=>{const result=convert(table,name);memory.set(name,result);return result}).finally(()=>inflight.delete(name));
    inflight.set(name,promise);return promise;
  }
  const methods={
    fbhMeta:async()=>({tabs:labels(),book:'INFRA LPs - PRODUTOS',user:{email:'',isEditor:false,canWrite:false,public:true},spreadsheetUrl:WORKBOOK}),
    fbhData:name=>load(name),
    fbhOverview:async()=>{
      const results=await Promise.allSettled(labels().map(async name=>({name,result:memory.get(name)||await load(name)})));

        const a=rows.filter(x=>String(x.cells[1]).trim().toUpperCase()==='ATIVA').length;
        const b=rows.filter(x=>String(x.cells[1]).trim().toUpperCase()==='INATIVA').length;
        byTab[name]={total:rows.length,active:a,inactive:b};total+=rows.length;active+=a;inactive+=b;
      }

    },

  };

  window.fbhEditLogin=()=>window.open(EDITOR,'_blank','noopener,noreferrer');
  window.fbhPublicLink=WORKBOOK;
})();

<script>
(()=>{'use strict';
const DEMO = !(window.google && google.script && google.script.run);
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const value=v=>v==null||String(v).trim()===''?'-':String(v);
const letters=i=>{let s='',n=i+1;while(n){n--;s=String.fromCharCode(65+n%26)+s;n=Math.floor(n/26)}return s};
const fallbackTabs=['Método CIS (new)','CAMILA VIEIRA','BUSINESS','PAULO VIEIRA','COLIGADAS'];
const headers=['NOME DA PÁGINA','STATUS','PRODUTO','FUNIL','NOVO NOME','NOVA URL (INFRA NOVA)','TIPOLOGIA','URL DA PÁGINA','URL DE EDIÇÃO','URL DE EDIÇÃO (NOVA INFRA)','ID DA PÁGINA','NOVO ID','SLUG DA PÁGINA','SLUG DA PÁGINA (NOVA INFRA)','TIPO DE PÁGINA','TIPO DE REDIRECIONAMENTO'];while(headers.length<47)headers.push('');Object.assign(headers,{16:'NOME DA PÁGINA DE OBRIGADO',17:'NOME DA PÁGINA DE OBRIGADO (NOVA INFRA)',18:'ID DA PÁGINA OBG',19:'ID OBG NOVA INFRA',20:'URL PÁGINA OBRIGADO',21:'URL PÁGINA OBRIGADO NOVA INFRA',22:'URL DE EDIÇÃO OBG',23:'URL DE EDIÇÃO OBG NOVA INFRA',24:'URL REDIRECIONADO',25:'URL REDIRECIONADO NOVA INFRA',26:'URL BOTÃO CONSULTOR',27:'ORIGEM',28:'NOVA ORIGEM',29:'CÓDIGO DA COLIGADA',30:'CÓDIGO DO CURSO',31:'CURSO ID',32:'TURMA ID',33:'CÓDIGO TURMA',34:'NOME POPUP',35:'NOME POPUP NOVA INFRA',36:'ID POPUP',37:'ID POPUP NOVA INFRA',38:'SLUG POPUP',39:'SLUG POPUP NOVA INFRA',40:'URL EDIÇÃO POPUP',41:'URL EDIÇÃO POPUP NOVA INFRA',42:'NOME FORMS',43:'NOME FORMS NOVA INFRA',44:'ID FORMS',45:'ID FORMS NOVA INFRA',46:'ASSETS'});
const demos=[['ATIVA','VSL','c2 - Google','LP - Método CIS | v0 c2 VSL','https://digital.febracis.com/l/metodo-cis-v0-c2-vsl2/','CHECKOUT'],['ATIVA','APLICAÇÃO','c3 - Facebook','LP - Método CIS | v1 c3 main','https://digital.febracis.com/l/metodo-cis-v1-c3-main/','LP DE OBRIGADO'],['ATIVA','APLICAÇÃO','c1 - Orgânico','LP - Método CIS Online | v1 c1','https://digital.febracis.com/l/metodo-cis-online-v1-c1/','CHECKOUT'],['INATIVA','APLICAÇÃO','c3 - Facebook','LP - Método CIS | v2 c3','https://digital.febracis.com/l/metodo-cis-v2-c3/','TYPEFORM']];
function demoData(tab){return {tab,headers,rows:demos.map((r,i)=>{let c=Array(47).fill('');c[0]='LP teste';c[1]=r[0];c[2]='CIS';c[3]=r[1];c[4]=r[3].replace('Método CIS',tab==='Método CIS (new)'?'Método CIS':tab);c[5]=r[4];c[6]=r[2];c[10]=String(5658+i*1234);c[14]='Landing Page';c[15]=r[5];c[28]='[LP][CIS][V'+(i+1)+'] | p-'+(5658+i*1234)+' | t-1001';c[29]=i%2?'2':'1';return {rowNumber:i+2,cells:c,originalFields:c.map((v,j)=>({column:j+1,label:headers[j]||`Coluna ${letters(j)}`,value:String(v||'')}))}})}}
let meta=null,selected=null,data=null,search='',searchDraft='',status='',loading=false,homeQuery='',homeDraft='',homeOverview=null,pageLimit=12,navToken=0;
function api(name,...args){
 if(DEMO){
  if(name==='fbhMeta')return Promise.resolve({tabs:fallbackTabs,user:{email:'demo@febracis.com.br',isEditor:true,canWrite:false},book:'INFRA LPs — PRODUTOS'});
  if(name==='fbhData')return Promise.resolve(demoData(args[0]));
  if(name==='fbhOverview')return Promise.resolve({total:null,active:null,inactive:null});
  return Promise.reject(new Error('Recurso indisponível na prévia local.'));
 }
 const maxWait=name==='fbhData'?35000:name==='fbhOverview'?30000:name==='fbhPresence'?12000:25000;
 return new Promise((resolve,reject)=>{
  let finished=false;
  const timer=setTimeout(()=>done(new Error('A consulta ao Google demorou mais que o esperado. Confira sua conta Febracis, a conexão e tente novamente.')),maxWait);
  function done(error,result){
   if(finished)return;
   finished=true;clearTimeout(timer);
   if(error)reject(error);else resolve(result);
  }
  try{
   if(!window.google||!window.google.script||!window.google.script.run){
    done(new Error('A conexão com o Google Apps Script não foi iniciada. Abra o link oficial do Hub com sua conta Febracis.'));
    return;
   }
   const method=google.script.run.withSuccessHandler(result=>done(null,result)).withFailureHandler(e=>done(new Error(e&&e.message?e.message:String(e))));
   if(typeof method[name]!=='function')throw new Error('A função '+name+' não está disponível na versão publicada do Hub.');
   method[name](...args);
  }catch(error){done(error);}
 });
}
function hero(title,desc,back=false){$('hero').innerHTML=`<div><div class="eyebrow">WORKSPACE / ${back?esc(selected):'VISÃO GERAL'}</div><div class="heroTitleRow"><h1>${esc(title)} <span style="color:#ffae30">✳</span></h1></div><p>${esc(desc)}</p></div><div>${back?'<button class="btn" data-go="home">← Todos os produtos</button>':'<span class="subtle">'+(DEMO?'Prévia · Dados ilustrativos':'Conectado à planilha')+'</span>'}</div>`}
function kpis(items){return `<div class="kpis">${items.map(([label,num,tip,icon])=>`<div class="kpi"><div class="top"><span class="eyebrow">${esc(label)}</span><span class="ico">${icon}</span></div><div class="metric">${esc(num)}</div><div class="caption">${esc(tip)}</div></div>`).join('')}</div>`}
async function home(){
 const current=++navToken;
 selected=null;data=null;search='';status='';homeQuery='';homeDraft='';
 closeDrawer();
 window.scrollTo({top:0,behavior:'instant'});
 hero('Uma infraestrutura, organizada','Encontre a estrutura de LPs do produto que você precisa.');
 syncMobileDock();
 renderHome();
 try{
  const result=await api('fbhOverview');
  if(navToken===current&&selected===null){homeOverview=result;renderHome();}
 }catch(e){console.warn('Resumo indisponível:',e.message);}
}
function renderHome(){
 const all=meta?.tabs||[];
 const tabs=all.filter(t=>!homeQuery||t.toLocaleLowerCase('pt-BR').includes(homeQuery.toLocaleLowerCase('pt-BR')));
 const stats=homeOverview?.byTab||{};
 const totals=tabs.reduce((a,t)=>{const v=stats[t]||{};a.total+=Number(v.total||0);a.active+=Number(v.active||0);return a},{total:0,active:0});
 const noStats=homeOverview===null;
 const metrics=kpis([['Produtos',tabs.length,homeQuery?'Resultados da busca':'Em operação','▦'],['Landing pages',noStats?'-':totals.total,homeQuery?'Nos produtos encontrados':'Total cadastrado','▤'],['Ativas',noStats?'-':totals.active,homeQuery?'Nos produtos encontrados':'Status ativo','↗']]);
 const tiles=tabs.map((t,i)=>{const item=stats[t]||{};return `<button class="productRow" data-product="${esc(t)}" aria-label="Abrir ${esc(t)}"><span class="productNum">${String(i+1).padStart(2,'0')}</span><span class="productMain"><strong class="productTitle">${esc(t)}</strong><small>${homeOverview?`${Number(item.total||0)} landing pages`:'Abrir biblioteca de LPs'}</small></span><span class="productGo">Abrir <span aria-hidden="true">↗</span></span></button>`}).join('');
 $('content').innerHTML=metrics+`<section class="workspaceSection"><div class="sectiontitle"><div><h2>Produtos</h2><p>Escolha um produto para acessar as landing pages.</p></div><span class="countPill">${tabs.length} de ${all.length}</span></div><div class="searchbar"><input class="search" id="homeSearch" type="search" aria-label="Pesquisar produtos" placeholder="Pesquisar produto..." value="${esc(homeDraft)}"><button class="btn dark searchButton" data-action="applyHomeSearch">⌕ Buscar</button>${homeQuery?'<button class="btn" data-action="clearHomeSearch">Limpar</button>':''}</div><div class="productList">${tiles||'<div class="emptyState">Nenhum produto encontrado. Tente outro termo.</div>'}</div></section>`;
}
async function product(tab){
 const current=++navToken;
 selected=tab;data=null;search='';searchDraft='';status='';pageLimit=12;
 window.scrollTo({top:0,behavior:'instant'});
 hero(tab,'Links, status e informações de cada landing page.',true);
 syncMobileDock();
 $('content').innerHTML='<div class="loader">Carregando páginas...</div>';
 try{
  const result=await api('fbhData',tab);
  if(navToken!==current)return;
  data=result;renderProduct();
 }catch(e){
  if(navToken!==current)return;
  $('content').innerHTML='<div class="status error"><strong>Não foi possível carregar as páginas.</strong><p>'+esc(e.message)+'</p><button type="button" class="btn" data-action="refresh">Tentar novamente</button><button type="button" class="btn" data-go="home">Voltar aos produtos</button></div>';
 }
}

function badge(v,kind=''){return `<span class="badge ${kind}">${esc(value(v))}</span>`}
function rowCell(r,n){return r.cells[n]||''}
function validUrl(s){try{const u=new URL(s);return ['https:','http:'].includes(u.protocol)?u.href:null}catch{return null}}
function matchedRows(){
 return (data?.rows||[]).filter(r=>{
  if(status&&String(rowCell(r,1)).trim().toUpperCase()!==status)return false;
  if(!search)return true;
  const needle=search.toLocaleLowerCase('pt-BR');
  return [...r.cells,...(r.originalFields||[]).map(f=>f.value)].some(v=>String(v||'').toLocaleLowerCase('pt-BR').includes(needle));
 });
}
function lpCard(r){
 const c=r.cells,url=validUrl(c[5]);
 return `<article class="lp"><div class="lphead"><div class="lpIdentity"><div class="eyebrow">LP · LINHA ${r.rowNumber}</div><div class="lpname">${esc(value(c[4]))}</div><div class="badges">${c[3]?badge(c[3],'funnel'):''}${c[6]?badge(c[6],'channel'):''}${c[14]?badge(c[14]):''}</div></div>${badge(c[1],String(c[1]).toUpperCase()==='ATIVA'?'active':String(c[1]).toUpperCase()==='INATIVA'?'inactive':'')}</div><div class="gridinfo"><div class="cell"><small>ENDEREÇO DA LP</small><span class="link" title="${esc(value(c[5]))}">${esc(value(c[5]))}</span></div><div class="cell"><small>ORIGEM</small><span title="${esc(value(c[28]))}">${esc(value(c[28]))}</span></div></div><div class="actions"><button class="btn" data-action="copyurl" data-row="${r.rowNumber}">⧉ Copiar link</button><button class="btn" data-action="copyorigin" data-row="${r.rowNumber}">Copiar origem</button><button class="btn" data-action="open" data-row="${r.rowNumber}" ${url?'':'disabled'}>↗ Abrir LP</button><button class="btn" data-action="editor" data-row="${r.rowNumber}">✎ Editar LP</button><button class="btn detailsButton" data-action="details" data-row="${r.rowNumber}">Informações completas →</button></div></article>`;
}
function renderProduct(){
 const visible=matchedRows();
 const active=visible.filter(r=>String(rowCell(r,1)).toUpperCase()==='ATIVA').length;
 const inactive=visible.filter(r=>String(rowCell(r,1)).toUpperCase()==='INATIVA').length;
 const resultLabel=search||status?'Resultados filtrados':'Total deste produto';
 const cards=visible.slice(0,pageLimit).map(lpCard).join('');
 $('content').innerHTML=kpis([['Landing pages',visible.length,resultLabel,'▤'],['Ativas',active,'Nos resultados','↗'],['Inativas',inactive,'Nos resultados','◌']])+`<section class="workspaceSection"><div class="sectiontitle"><div><h2>Biblioteca de landing pages</h2><p>Pesquise, copie links ou abra os detalhes de cada LP.</p></div><span class="countPill">${visible.length} resultados</span></div><div class="filters"><div class="searchbar lpSearch"><input class="search" id="search" type="search" aria-label="Buscar landing pages" placeholder="Nome, URL, origem ou qualquer campo..." value="${esc(searchDraft)}"><button class="btn dark searchButton" data-action="applySearch">⌕ Buscar</button></div><select class="chipselect" id="status" aria-label="Filtrar status"><option value="">Todos os status</option><option value="ATIVA" ${status==='ATIVA'?'selected':''}>Ativas</option><option value="INATIVA" ${status==='INATIVA'?'selected':''}>Inativas</option></select>${search||status?'<button class="btn" data-action="clearSearch">Limpar filtros</button>':''}<button class="btn refreshButton" data-action="refresh">↻ Atualizar</button>${meta?.user?.canWrite?'<button class="btn gold newLpButton" data-action="create">+ Adicionar LP</button>':''}</div>${data.warning?`<div class="status">${esc(data.warning)}</div>`:''}${data.truncated?'<div class="status">A leitura foi limitada às primeiras linhas da aba.</div>':''}<div class="list" id="results">${cards||'<div class="emptyState">Nenhuma LP encontrada. Revise a busca ou o status.</div>'}</div>${visible.length>pageLimit?`<div class="loadMoreWrap"><button class="btn" data-action="loadmore">Ver mais LPs · ${Math.min(pageLimit,visible.length)} de ${visible.length}</button></div>`:''}</section>`;
}
function renderResultsOnly(){renderProduct()}
function showDetails(r){
 const fields=r.originalFields||r.extraFields||[];
 const filled=fields.filter(f=>String(f.value||'').trim()!=='');
 const empty=fields.filter(f=>String(f.value||'').trim()==='');
 const line=f=>{const h=validUrl(f.value);return `<div class="detailField"><label>COLUNA ${letters(f.column-1)} · ${esc(f.label||'Sem título')}</label><div class="val">${h?`<a href="${esc(h)}" target="_blank" rel="noopener noreferrer">${esc(f.value)}</a>`:esc(value(f.value))}</div></div>`};
 $('drawerTitle').textContent='Dados completos da LP';
 $('drawerBody').innerHTML=`<div class="detailIntro"><div class="eyebrow">LINHA ${r.rowNumber} · ${esc(selected)}</div><h2>${esc(value(rowCell(r,4)))}</h2><p>Todos os campos originais desta linha, sem perda de informações.</p></div><section><h3>Campos preenchidos · ${filled.length}</h3>${filled.map(line).join('')||'<p>Nenhum campo preenchido.</p>'}</section>${empty.length?`<details class="emptyFields"><summary>Exibir ${empty.length} campos vazios</summary><section>${empty.map(line).join('')}</section></details>`:''}`;
 openDrawer();
}

function openDrawer(){$('backdrop').classList.add('show');$('drawer').classList.add('show')}function closeDrawer(){$('backdrop').classList.remove('show');$('drawer').classList.remove('show')}
function notify(txt){let x=document.getElementById('toast');if(!x){x=document.createElement('div');x.id='toast';x.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#21242b;color:#fff;border-radius:12px;padding:12px 18px;z-index:40;box-shadow:0 8px 30px #0003;font-size:12px';document.body.append(x)}x.textContent=txt;x.hidden=false;clearTimeout(window.__toast);window.__toast=setTimeout(()=>x.hidden=true,2500)}
async function copyText(s){if(!s){notify('Este campo está vazio.');return}try{await navigator.clipboard.writeText(s);notify('Copiado para a área de transferência')}catch(e){window.prompt('Copie o texto:',s)}}
let formBusy=false;
async function showCreate(){
 if(!meta?.user?.canWrite){notify('O cadastro está disponível apenas para editores.');return;}
 $('drawerTitle').textContent='Adicionar LP · '+selected;
 $('drawerBody').innerHTML='<div class="loader">Preparando campos da planilha...</div>';
 openDrawer();
 try{
   const schema=await api('fbhFormSchema',selected);
   if(!schema.canWrite)throw new Error('Sem autorização de cadastro nesta aba.');
   const special=[schema.nameColumn,schema.urlColumn,schema.statusColumn].filter(i=>i>=0);
   const priority=['PRODUTO','FUNIL','TIPOLOGIA','TIPO DE PÁGINA'];
   const essentials=schema.fields.filter(f=>special.includes(f.column)||priority.includes(f.label.toUpperCase()));
   const optional=schema.fields.filter(f=>!essentials.some(t=>t.column===f.column));
   const label=f=>`<label class="formFieldLabel" for="col_${f.column}">${esc(f.label)} ${f.required?'<em>*</em>':''}<small>Coluna ${letters(f.column)}</small></label>`;
   const field=f=>{
     const attrs=`id="col_${f.column}" name="col_${f.column}" data-col="${f.column}" ${f.required?'required':''}`;
     const choices=Array.isArray(f.options)?f.options:[];
     let control='';
     if(choices.length&&f.kind==='status'){
       control=`<select class="chipselect formControl" ${attrs}><option value="">Selecionar status</option>${choices.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select>`;
     }else{
       const l=choices.length&&choices.length<45?`list="options_${f.column}"`:'';
       control=`<input class="search formControl" ${attrs} ${l} type="${f.kind==='url'?'url':'text'}" maxlength="2000" placeholder="${f.kind==='url'?'https://...':f.required?'Informe o valor':'Opcional'}" autocomplete="off">${l?`<datalist id="options_${f.column}">${choices.map(v=>`<option value="${esc(v)}"></option>`).join('')}</datalist>`:''}`;
     }
     return `<div class="createField">${label(f)}${control}</div>`;
   };
   $('drawerBody').innerHTML=`<div class="detailIntro"><div class="eyebrow">NOVO CADASTRO · ${esc(selected)}</div><h2>Nova landing page</h2><p>Preencha os dados principais. Os campos adicionais seguem exatamente as colunas originais desta aba.</p></div><form id="createForm"><section class="formSection"><h3>Dados principais</h3><div class="createFields">${essentials.map(field).join('')}</div></section><details class="extraDetails"><summary>Campos adicionais da planilha · ${optional.length}</summary><div class="createFields">${optional.map(field).join('')}</div></details><div class="createActions"><button class="btn" data-action="cancelCreate" type="button">Cancelar</button><button class="btn gold saveLpButton" type="submit">Salvar LP</button></div><p class="formHint">Somente editores podem cadastrar. A nova LP será incluída na aba ${esc(selected)} sem alterar registros existentes.</p></form>`;
   const statusInput=$('createForm').querySelector(`[data-col="${schema.statusColumn}"]`);
   if(statusInput&&statusInput.tagName==='SELECT'&&[...statusInput.options].some(o=>o.value==='ATIVA'))statusInput.value='ATIVA';
 }catch(e){$('drawerBody').innerHTML=`<div class="status error">${esc(e.message)}</div><button class="btn" data-action="cancelCreate">Voltar</button>`}
}
document.addEventListener('submit',async ev=>{
 if(ev.target.id!=='createForm')return;
 ev.preventDefault();if(formBusy)return;
 if(!meta?.user?.canWrite){notify('Sem permissão de cadastro.');return;}
 const fields={};ev.target.querySelectorAll('[data-col]').forEach(el=>{if(el.value.trim())fields[el.dataset.col]=el.value.trim()});
 const button=ev.target.querySelector('[type="submit"]');
 formBusy=true;button.disabled=true;button.textContent='Salvando...';
 try{
   const result=await api('fbhCreate',selected,fields);
   if(!result?.ok)throw new Error('O Google não confirmou a gravação.');
   closeDrawer();homeOverview=null;
   await product(selected);
   notify(`LP cadastrada na linha ${result.rowNumber}.`);
 }catch(e){notify(e.message);button.disabled=false;button.textContent='Salvar LP'}
 finally{formBusy=false}
});
document.addEventListener('click',async e=>{
 const t=e.target.closest('[data-product],[data-go],[data-action]');if(!t)return;
 if(t.dataset.product)return product(t.dataset.product);
 if(t.dataset.go)return home();
 const act=t.dataset.action;
 if(act==='applyHomeSearch'){homeQuery=homeDraft.trim();renderHome();return}
 if(act==='clearHomeSearch'){homeDraft='';homeQuery='';renderHome();return}
 if(act==='refresh'&&selected){return product(selected);}
 if(!data)return;
 if(act==='applySearch'){search=searchDraft.trim();pageLimit=12;renderProduct();return}
 if(act==='clearSearch'){search='';searchDraft='';status='';pageLimit=12;renderProduct();return}
 if(act==='loadmore'){pageLimit+=12;renderProduct();return}
 if(act==='refresh')return product(selected);
 if(act==='create')return showCreate();
 if(act==='cancelCreate'){closeDrawer();return}
 const r=data.rows.find(r=>String(r.rowNumber)===t.dataset.row);if(!r)return;
 if(act==='editor')return window.fbhEditLogin();
 if(act==='details')return showDetails(r);
 if(act==='copyurl')return copyText(rowCell(r,5));
 if(act==='copyorigin')return copyText(String(rowCell(r,28)||''));
 if(act==='open'){const u=validUrl(rowCell(r,5));if(u)window.open(u,'_blank','noopener,noreferrer');return}
});
document.addEventListener('input',e=>{
 if(e.target.id==='homeSearch')homeDraft=e.target.value;
 if(e.target.id==='search')searchDraft=e.target.value;
});
document.addEventListener('change',e=>{if(e.target.id==='status'){status=e.target.value;pageLimit=12;renderProduct()}});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape')closeDrawer();
 if(e.key==='Enter'&&e.target.id==='homeSearch'){e.preventDefault();homeQuery=homeDraft.trim();renderHome()}
 if(e.key==='Enter'&&e.target.id==='search'){e.preventDefault();search=searchDraft.trim();pageLimit=12;renderProduct()}
});

$('backdrop').onclick=closeDrawer;$('close').onclick=closeDrawer;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});
async function refreshVisibleTabs(){
 if(DEMO || !meta) return;
 try {
   const updated=await api('fbhMeta');
   const changed=JSON.stringify(updated.tabs)!==JSON.stringify(meta.tabs);
   meta=updated;
   $('viewSwitcher').style.display='flex';
   if(changed){
     if(selected && !updated.tabs.includes(selected)){closeDrawer();await home();notify('A aba foi removida da lista de produtos.');}
     else if(selected===null){await home();notify('A lista de produtos foi atualizada.');}
   }
 }catch(error){console.warn('Falha ao atualizar visibilidade das abas:',error.message);}
}
function refreshPresence(){
 if(!meta)return;
 if(meta.user?.public){$('presenceCount').textContent='Público';return;}
 api('fbhPresence').then(p=>{
  var arr=p.people||[];
  const avatar=u=>{const photo=String(u.photo||'');const canPhoto=/^https:\/\/(?:[^\/]+\.)?(?:googleusercontent\.com|ggpht\.com)\//i.test(photo);return '<span class=\"presenceAvatar\" title=\"'+esc(u.name||'Colaborador')+' · '+esc(u.email||'')+'\">'+(canPhoto?'<img alt=\"\" loading=\"lazy\" referrerpolicy=\"no-referrer\" src=\"'+esc(photo)+'\" onerror=\"this.remove()\">':'')+'<span class=\"avatarFallback\">'+esc(u.initials||'?')+'</span></span>'};
  $('presenceAvatars').innerHTML=arr.slice(-6).reverse().map(avatar).join('')+(arr.length>6?'<span class=\"presenceAvatar extraUsers\" title=\"Mais '+(arr.length-6)+' pessoas\">+'+(arr.length-6)+'</span>':'');
  const myself=p.self||{};
  if(myself.email&&myself.email!==meta.user.email){$('accountIdentity').textContent='Conta mudou · recarregue';$('accountStripText').textContent='Conta Google alterada · atualize a página';$('accountIdentity').title='Conta Google mudou durante a sessão. Atualize para validar permissões.';meta.user.canWrite=false;meta.user.isEditor=false;$('viewSwitcher').style.display='none';document.querySelectorAll('.newLpButton,.editLpButton').forEach(x=>x.remove());return;}
  const current=arr.find(u=>u.email===meta.user.email);
  if(current){$('userAvatar').innerHTML=avatar(current);$('userAvatar').title=current.name+' · '+current.email;}
  $('presenceCount').textContent=arr.length===1?'1 pessoa':arr.length+' pessoas';
 }).catch(()=>{$('presenceCount').textContent='-';});
}
$('brandHome').onclick=()=>{if(meta)home();else location.reload();};
$('accountStripHelp').onclick=()=>alert('Este Hub acompanha o compartilhamento público da planilha: qualquer pessoa com o link pode visualizar. Para editar, entre pelo acesso de editor com uma conta que tenha permissão de edição na planilha.');
$('mobileProducts').onclick=()=>{if(meta)home();window.scrollTo({top:0,behavior:'smooth'});};
function syncMobileDock(){
 const isProduct=!!selected;
 const canAdd=!!(isProduct&&meta?.user?.canWrite);
 $('mobileActionIcon').textContent=canAdd?'＋':'↻';
 $('mobileActionLabel').textContent=canAdd?'Nova LP':'Atualizar';
 $('mobileAction').setAttribute('aria-label',canAdd?'Adicionar LP':'Atualizar dados');
 $('mobileProducts').classList.toggle('isActive',!isProduct);
 $('mobileAction').classList.toggle('isPrimary',canAdd);
}
$('mobileSearch').onclick=()=>{const el=$(selected?'search':'homeSearch');if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.focus({preventScroll:true});}else if(meta)home()};
$('mobileAction').onclick=()=>{if(selected&&meta?.user?.canWrite)return showCreate();if(selected)return product(selected);if(meta)return home()};
$('openSheet').onclick=()=>{if(meta?.spreadsheetUrl)window.open(meta.spreadsheetUrl,'_blank','noopener,noreferrer')};$('openEditor').onclick=()=>window.fbhEditLogin();
api('fbhMeta').then(m=>{
 meta=m;
 syncMobileDock();
 $('userAvatar').textContent=m.user.public?'👁':'F';
 $('accountIdentity').textContent=m.user.public?'Visualização pública':'Leitor · '+(m.user.email||'Conta Google não identificada');
 $('accountIdentity').title='Conta autenticada: '+(m.user.email||'não identificada')+' · '+(m.user.isEditor?'editor':'somente leitura');
 $('accountStripText').textContent=m.user.public?'Acesso público · leitura liberada':'Leitor · '+(m.user.email||'Conta não identificada');
 $('viewSwitcher').style.display='flex';
 home();
 if(DEMO){$('presenceCount').textContent='prévia';}
 else {refreshPresence();setInterval(refreshPresence,45000);setInterval(refreshVisibleTabs,60000);}
}).catch(e=>{$('content').innerHTML='<div class="status error"><strong>Não foi possível conectar ao Hub.</strong><p>'+esc(e.message)+'</p><button class="btn" id="retryHub">Tentar novamente</button></div>';$('retryHub').onclick=()=>location.reload();});
})();
</script></body></html>
